plugins {
    id 'java'
    id 'application'
}

group 'me.nifty'
version '1.0.0'

jar {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    manifest {
        attributes 'Main-Class': 'me.nifty.Nifty'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.lavalink.dev/releases' }
    maven { url 'https://maven.lavalink.dev/snapshots' }
    maven { url 'https://maven.topi.wtf/releases' }
}

dependencies {
    implementation('io.github.cdimascio:dotenv-java:2.3.1')
    implementation("org.postgresql:postgresql:42.7.7")
    implementation("com.zaxxer:HikariCP:6.3.0")

    implementation("net.dv8tion:JDA:6.4.1")

    implementation("moe.kyokobot.libdave:adapter-jda:ce725965e")
    implementation("moe.kyokobot.libdave:impl-jni:ce725965e")
    runtimeOnly("moe.kyokobot.libdave:natives-win-x86-64:ce725965e")        // your Windows machine
    runtimeOnly("moe.kyokobot.libdave:natives-linux-x86-64:ce725965e")      // glibc Linux (Debian/Ubuntu)
    runtimeOnly("moe.kyokobot.libdave:natives-linux-musl-x86-64:ce725965e") // musl Linux (Alpine Docker server)

    implementation("dev.arbjerg:lavaplayer:2.2.6")
    implementation("dev.lavalink.youtube:common:1.18.1")
    implementation("dev.arbjerg:lavadsp:0.7.8")
    implementation("com.github.topi314.lavasrc:lavasrc:4.8.3")

    implementation("org.jsoup:jsoup:1.15.3")
    implementation("org.json:json:20250107")

    // Dashboard add-on: optional WebSocket client. The bot runs fine without it.
    implementation("org.java-websocket:Java-WebSocket:1.6.0")
}